spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: ticket-booking
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8722
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_user?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000

logging:
  level:
    com.ticketbooking: INFO

jwt:
  secret: ticket-booking-jwt-secret-key-for-demo-purpose-only

multi-level-cache:
  user:
    enabled: true