spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: ticket-booking
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8723
      eager: true

jwt:
  secret: ticket-booking-jwt-secret-key-for-demo-purpose-only

logging:
  level:
    com.ticketbooking: INFO
    org.springframework.cloud.gateway: DEBUG

knife4j:
  gateway:
    enabled: true          # 开启网关聚合
    strategy: discover     # 动态发现模式（配合 Nacos）
    discover:
      enabled: true