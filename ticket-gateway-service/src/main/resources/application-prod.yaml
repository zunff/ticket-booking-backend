spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-headless:8848}
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:ticket-booking}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${sentinel.transport.port:8723}
      eager: true

jwt:
  secret: ${JWT_SECRET:ticket-booking-jwt-secret-key-for-demo-purpose-only}
  cache:
    enabled: ${JWT_CACHE_ENABLED:true}
    expire-minutes: ${JWT_CACHE_EXPIRE_MINUTES:5}
    max-size: ${JWT_CACHE_MAX_SIZE:10000}

logging:
  level:
    com.ticketbooking: INFO
    org.springframework.cloud.gateway: INFO

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
