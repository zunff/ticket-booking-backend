server:
  port: 8083
  servlet:
    context-path: /stock

spring:
  application:
    name: ticket-stock-service
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ticketbooking: INFO

feign:
  sentinel:
    enabled: true

