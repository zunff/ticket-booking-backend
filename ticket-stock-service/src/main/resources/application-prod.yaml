spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-headless:8848}
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:ticket-booking}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${sentinel.transport.port:8721}
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-headless}:${MYSQL_PORT:3306}/ticket_stock?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis-headless}
      port: ${REDIS_PORT:6379}
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-headless:9092}
    consumer:
      group-id: stock-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.ticketbooking.order.mq.TicketOrderMessage:com.ticketbooking.common.mq.TicketOrderMessage"
    listener:
      concurrency: 5
      ack-mode: manual

logging:
  level:
    com.ticketbooking: INFO
    org.springframework.kafka: WARN
