spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-headless:8848}
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:ticket-booking}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${sentinel.transport.port:8719}
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-headless}:${MYSQL_PORT:3306}/ticket_ticket?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis-headless}
      port: ${REDIS_PORT:6379}
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

logging:
  level:
    com.ticketbooking: INFO

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job-admin:8880/xxl-job-admin}
      username: admin
      password: 123456
    executor:
      appname: ticket-executor
      address: ""
      ip: ""
      port: 0
      logpath: /tmp/xxl-job/logs
      logretentiondays: 30
    accessToken: default_token
