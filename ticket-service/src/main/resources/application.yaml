server:
  port: 8080

spring:
  application:
    name: ticket-service
  threads:
    virtual:
      enabled: true

# 演唱会多级缓存（演唱会详情、票价档位）
multi-level-cache:
  concert:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticketbooking: INFO

feign:
  sentinel:
    enabled: true