server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ticket-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticketbooking: INFO
