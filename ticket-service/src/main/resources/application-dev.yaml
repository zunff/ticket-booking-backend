spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: ticket-booking
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_ticket?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

logging:
  level:
    com.ticketbooking: INFO

xxl:
  job:
    admin:
      addresses: http://localhost:8880/xxl-job-admin
    executor:
      appname: ticket-executor
      address: ""                                     # 留空用 ip + port
      ip: ""                                          # 留空自动获取（推荐容器环境）
      port: 0                                         # 0 表示自动获取随机端口（推荐）
      logpath: ./.log/xxl-job
      logretentiondays: 30
    accessToken: default_token
