apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-order-service
  namespace: ticket-booking
  labels:
    app: ticket-order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-order-service
  template:
    metadata:
      labels:
        app: ticket-order-service
    spec:
      initContainers:
      - name: wait-for-nacos
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z nacos-headless 8848; do echo waiting for nacos; sleep 2; done']
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka-headless 9092; do echo waiting for kafka; sleep 2; done']
      containers:
      - name: ticket-order-service
        image: ticket-booking/ticket-order-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: sentinel.transport.port
          value: "8720"
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "1200m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /order/actuator/health
            port: 8082
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /order/actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
