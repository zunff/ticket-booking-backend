apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: ticket-booking
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
      - name: ticket-service
        image: ticket-service:latest
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: app-secret
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: ticket-booking
spec:
  selector:
    app: ticket-service
  ports:
  - port: 8080
    targetPort: 8080
