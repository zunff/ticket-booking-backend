apiVersion: v1
kind: Service
metadata:
  name: nacos-headless
  namespace: ticket-booking
  labels:
    app: nacos
spec:
  ports:
  - port: 8848
    name: http
    targetPort: 8848
  - port: 9848
    name: grpc-client
    targetPort: 9848
  - port: 9849
    name: grpc-server
    targetPort: 9849
  clusterIP: None
  selector:
    app: nacos
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: ticket-booking
  labels:
    app: nacos
spec:
  type: NodePort
  ports:
  - port: 8848
    name: http
    targetPort: 8848
    nodePort: 30848
  selector:
    app: nacos
