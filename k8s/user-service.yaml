apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: ticket-booking
type: Opaque
stringData:
  MYSQL_HOST: host.docker.internal
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ticket_booking
  MYSQL_USER: root
  MYSQL_PASSWORD: root123
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"
  RABBITMQ_HOST: host.docker.internal
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  SPRING_PROFILES_ACTIVE: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: app-secret
        ports:
        - containerPort: 8081
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ticket-booking
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081
