spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos-headless:8848}
        namespace: ${NACOS_NAMESPACE:prod}
        group: ${NACOS_GROUP:ticket-booking}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${sentinel.transport.port:8720}
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-headless}:${MYSQL_PORT:3306}/ticket_payment?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis-headless}
      port: ${REDIS_PORT:6379}
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-headless:9092}
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        spring.json.trusted.packages: "*"

logging:
  level:
    com.ticketbooking: INFO

# 支付渠道配置（生产环境凭证通过环境变量注入；mock 在生产关闭）
payment:
  mock:
    enabled: false
    cashier-base-url: ${PAYMENT_CASHIER_BASE_URL:https://api.example.com/api/payment}
  channels:
    wechat:
      enabled: true
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
      cert-serial-no: ${WECHAT_CERT_SERIAL_NO:}
      notify-url: ${WECHAT_NOTIFY_URL:http://ticket-payment-service:8085/payment/notify/wechat}
    alipay:
      enabled: true
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      notify-url: ${ALIPAY_NOTIFY_URL:http://ticket-payment-service:8085/payment/notify/alipay}
      return-url: ${ALIPAY_RETURN_URL:}
