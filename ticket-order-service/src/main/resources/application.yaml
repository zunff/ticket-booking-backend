server:
  port: 8082
  servlet:
    context-path: /order

spring:
  application:
    name: ticket-order-service
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticketbooking: INFO

feign:
  sentinel:
    enabled: true