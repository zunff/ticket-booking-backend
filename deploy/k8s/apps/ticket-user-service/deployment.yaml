apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-user-service
  namespace: ticket-booking
  labels:
    app: ticket-user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-user-service
  template:
    metadata:
      labels:
        app: ticket-user-service
    spec:
      initContainers:
      - name: wait-for-nacos
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z nacos-headless 8848; do echo waiting for nacos; sleep 2; done']
      containers:
      - name: ticket-user-service
        image: ticket-booking/ticket-user-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: sentinel.transport.port
          value: "8722"
        - name: JAVA_OPTS
          value: "-Xmx384m -Xms192m -XX:+UseG1GC"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /users/actuator/health
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /users/actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
