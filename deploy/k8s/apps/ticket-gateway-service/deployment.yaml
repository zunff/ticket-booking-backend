apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-gateway-service
  namespace: ticket-booking
  labels:
    app: ticket-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-gateway-service
  template:
    metadata:
      labels:
        app: ticket-gateway-service
    spec:
      initContainers:
      - name: wait-for-nacos
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z nacos-headless 8848; do echo waiting for nacos; sleep 2; done']
      containers:
      - name: ticket-gateway-service
        image: ticket-booking/ticket-gateway-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: sentinel.transport.port
          value: "8723"
        - name: JAVA_OPTS
          value: "-Xmx1024m -Xms512m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=15"
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "1500m"
            memory: "1280Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
